# Optional per-agent overrides for the backend connection.
# Copy this file to config.yaml beside SOUL.md and uncomment what you need.
# Everything not set here comes from .env. .env remains required.
#
# config.yaml is gitignored because apiKey is usually a secret.
#
# apiUrl: https://ollama.example.com/v1
# apiKey: sk-...
# model: beam:cloud
# Whether the model accepts image input (default false).
# vision: true
# maxInputTokens: 100000
# compactionThreshold: 0.75
# compactionKeepTurns: 6
# Character budgets for MEMORY.md and USER.md.
# memoryLimit: 2200
# userLimit: 1375
# allowedUsers:
#   - alice
# deniedUsers:
#   - mallory
# Default reasoning effort: off, minimal, low, medium, high, xhigh.
# reasoningEffort: off
# Efforts clients may select per request (empty = default only).
# allowedReasoningEfforts:
#   - low
#   - medium
#   - high
